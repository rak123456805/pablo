services:
  db:
    image: postgres:16-alpine
    container_name: peblo_db
    environment:
      POSTGRES_DB: peblo
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblodev
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgres:16-alpine
    container_name: peblo_db_test
    environment:
      POSTGRES_DB: peblo_test
      POSTGRES_USER: peblo
      POSTGRES_PASSWORD: peblodev
    ports:
      - "5433:5432"
    volumes:
      - pg_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peblo -d peblo_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: peblo_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://peblo:peblodev@db:5432/peblo
      DATABASE_SYNC_URL: postgresql+psycopg://peblo:peblodev@db:5432/peblo
      STORAGE_BACKEND: local
      LOCAL_STORAGE_PATH: /app/storage
      LOCAL_STORAGE_BASE_URL: http://localhost:8000/static
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./seed_shows.json:/app/seed_shows.json:ro
      - ./reference.json:/app/reference.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: peblo_frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pg_data:
  pg_test_data:
